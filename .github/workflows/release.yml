name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "release.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.version }}"
            $prerelease = "${{ inputs.prerelease }}"
          }
          elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $prerelease = "false"
          }
          else {
            $manifest = Get-Content release.json -Raw | ConvertFrom-Json
            $tag = [string]$manifest.version
            $prerelease = ([bool]$manifest.prerelease).ToString().ToLower()
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "PRERELEASE=$prerelease" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/vitrunda.exe dist/Vitrunda.exe
          Compress-Archive -Path dist/Vitrunda.exe -DestinationPath dist/Vitrunda-windows-x64.zip
          (Get-FileHash dist/Vitrunda.exe -Algorithm SHA256).Hash.ToLower() + "  Vitrunda.exe" |
            Out-File -Encoding ascii dist/SHA256SUMS.txt
          (Get-FileHash dist/Vitrunda-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  Vitrunda-windows-x64.zip" |
            Add-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Vitrunda ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          files: |
            dist/Vitrunda.exe
            dist/Vitrunda-windows-x64.zip
            dist/SHA256SUMS.txt
